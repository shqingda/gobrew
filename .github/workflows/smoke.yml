name: Bottle smoke tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify live signed catalog
        run: go test -tags=integration ./internal/catalog
      - name: Build and exercise real bottles
        run: |
          go build -trimpath -o bin/gobrew ./cmd/gobrew
          scripts/smoke.sh "$PWD/bin/gobrew"
        env:
          CGO_ENABLED: '0'
